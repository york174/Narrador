<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Notas y Audio TTS</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        button { background: #0078d4; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 600; }
        button:hover { background: #005a9e; }
        .file-list { list-style: none; padding: 0; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #f9fbfd; border: 1px solid #e1e8ed; margin-bottom: 10px; border-radius: 8px; }
        .actions { display: flex; gap: 10px; align-items: center; }
        .btn-convert { background: #107c41; }
        .btn-convert:hover { background: #0b5930; }
        
        /* Ventana Modal (Editor de texto) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 600px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .modal-content input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .modal-content textarea { width: 100%; height: 250px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; resize: none; margin-bottom: 15px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .btn-cancel { background: #a80000; }
        .btn-cancel:hover { background: #7a0000; }
        audio { display: none; margin-top: 15px; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📝 Mis Archivos de Texto</h2>
        <button onclick="abrirEditor()">+ Crear Nuevo Archivo</button>
    </div>
    
    <audio id="globalAudio" controls></audio>
    <ul id="listaArchivos" class="file-list"></ul>
</div>

<!-- Ventana Flotante del Editor -->
<div id="editorModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitulo">Nuevo Archivo de Texto</h3>
        <input type="text" id="nombreArchivo" placeholder="Nombre del archivo (ej: cuento, nota1)">
        <textarea id="contenidoArchivo" placeholder="Escribe el contenido de tu archivo aquí..."></textarea>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="cerrarEditor()">Salir sin guardar</button>
            <button onclick="guardarTexto()">Guardar y Salir</button>
        </div>
    </div>
</div>

<script>
    // Cargar la lista al abrir la página
    document.addEventListener("DOMContentLoaded", cargarArchivos);

    function abrirEditor() {
        document.getElementById("nombreArchivo").value = "";
        document.getElementById("contenidoArchivo").value = "";
        document.getElementById("editorModal").style.display = "flex";
    }

    function cerrarEditor() {
        document.getElementById("editorModal").style.display = "none";
    }

    async function cargarArchivos() {
        const res = await fetch('/api/archivos');
        const archivos = await res.json();
        const lista = document.getElementById("listaArchivos");
        lista.innerHTML = archivos.length === 0 ? "<p style='color:gray;'>No hay archivos creados aún.</p>" : "";
        
        archivos.forEach(file => {
            lista.innerHTML += `
                <li class="file-item">
                    <span>📄 <strong>${file}</strong></span>
                    <div class="actions">
                        <button class="btn-convert" onclick="convertirAudio('${file}', this)">🔊 Convertir a Audio</button>
                    </div>
                </li>
            `;
        });
    }

    async function guardarTexto() {
        const nombre = document.getElementById("nombreArchivo").value;
        const contenido = document.getElementById("contenidoArchivo").value;

        if(!nombre.trim()) return alert("Por favor escribe un nombre para el archivo");

        const res = await fetch('/api/guardar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ nombre, contenido })
        });

        if(res.ok) {
            cerrarEditor();
            cargarArchivos(); // Recarga la lista principal
        } else {
            alert("Error al guardar el archivo");
        }
    }

    async function convertirAudio(filename, boton) {
        const textoOriginal = boton.innerText;
        boton.innerText = "⏳ Procesando...";
        boton.disabled = true;

        try {
            const res = await fetch(`/api/convertir/${filename}`, { method: 'POST' });
            const data = await res.json();
            
            if(data.success) {
                const player = document.getElementById("globalAudio");
                // Añadimos un parámetro random para evitar que el navegador guarde en caché audios viejos
                player.src = data.audio_url + "?t=" + new Date().getTime();
                player.style.display = "block";
                player.play();
            } else {
                alert("Error: " + data.error);
            }
        } catch (e) {
            alert("Error de conexión con el servidor");
        } finally {
            boton.innerText = textoOriginal;
            boton.disabled = false;
        }
    }
</script>
</body>
</html>
